name: Сборка APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Собрать GameShelf
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Права на gradlew
        run: chmod +x gradlew

      - name: Подготовить ключ подписи (если задан в секретах)
        env:
          KEYSTORE_B64: ${{ secrets.GAMESHELF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GAMESHELF_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Сборка release APK
        env:
          GAMESHELF_STORE_PASSWORD: ${{ secrets.GAMESHELF_STORE_PASSWORD }}
          GAMESHELF_KEY_ALIAS: ${{ secrets.GAMESHELF_KEY_ALIAS }}
          GAMESHELF_KEY_PASSWORD: ${{ secrets.GAMESHELF_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Переименовать APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GameShelf-v${VERSION}.apk"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -la dist

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: GameShelf-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Опубликовать APK в Releases
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: GameShelf v${{ env.APP_VERSION }}
          make_latest: true
          body: |
            GameShelf от LUNEXA — библиотека игр.
            Скачайте файл GameShelf-v${{ env.APP_VERSION }}.apk ниже и установите на Android 8.0+.
